name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: RaidClipPlugin

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version prüfen
        shell: pwsh
        run: |
          [xml]$project = Get-Content "RaidClipPlugin.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}".TrimStart("v")
            if ($version -ne $tagVersion) { throw "Tag $tagVersion stimmt nicht mit Projektversion $version überein." }
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Unit-Tests ausführen
        shell: pwsh
        run: |
          $env:FUNJII_RPG_TEST_DATA_ROOT = Join-Path $env:RUNNER_TEMP "otter-release-tests"
          dotnet test "Tests\RaidClipPlugin.Tests.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Backend- und Publisher-Tests ausführen
        shell: pwsh
        run: dotnet test "..\Sync\tests\Backend.Tests\Backend.Tests.csproj" -c Release

      - name: Windows-App erstellen
        shell: pwsh
        run: dotnet publish "RaidClipPlugin.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o "publish"

      - name: Update-ZIP erstellen
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "installer-output" | Out-Null
          Compress-Archive -Path "publish\*" -DestinationPath "installer-output\RaidClipPlugin-Update-$env:APP_VERSION.zip" -Force

      - name: Inno Setup installieren
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Windows-Installer erstellen
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "Installer\RaidClipPlugin.iss"'

      - name: update.json erzeugen
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $zipName = "RaidClipPlugin-Update-$env:APP_VERSION.zip"
          $zipPath = Join-Path "installer-output" $zipName
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          $releaseTag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$env:APP_VERSION" }
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$releaseTag/$zipName"
          $manifest = [ordered]@{
            latestVersion = $env:APP_VERSION
            downloadUrl = $downloadUrl
            changelog = "Änderungen siehe GitHub Release $releaseTag."
            sha256 = $hash
          }
          $manifest | ConvertTo-Json | Set-Content "installer-output\update.json" -Encoding UTF8

      - name: Prüfsummen erzeugen
        shell: pwsh
        run: |
          Get-ChildItem "installer-output" -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
          } | Set-Content "installer-output\SHA256.txt"

      # Draft only. Public publication requires release-gate review and the owner's approval.
      - name: GitHub Release als Entwurf vorbereiten
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$env:APP_VERSION" }
          $repository = "${{ github.repository }}"
          $releases = gh api "repos/$repository/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseCandidates = @($releases | Where-Object { $_.tag_name -eq $tag })
          if ($releaseCandidates.Count -gt 1) { throw "Mehrere Entwürfe für denselben Tag; manuell prüfen." }
          if ($releaseCandidates.Count -eq 0) {
            $created = gh api --method POST "repos/$repository/releases" -f "tag_name=$tag" -f "target_commitish=${{ github.sha }}" -f "name=RaidClipPlugin $env:APP_VERSION" -F draft=true | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $releaseCandidates = @($created)
          }
          if ($releaseCandidates.Count -ne 1 -or -not $releaseCandidates[0].draft) {
            throw "Nur ein unveröffentlichter Entwurf darf aktualisiert werden."
          }
          $release = $releaseCandidates[0]
          gh api --method PATCH "repos/$repository/releases/$($release.id)" -f "tag_name=$tag" -f "target_commitish=${{ github.sha }}" --silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          foreach ($name in @("RaidClipPlugin-Setup-$env:APP_VERSION.exe", "RaidClipPlugin-Update-$env:APP_VERSION.zip", "update.json", "SHA256.txt")) {
            $current = gh api "repos/$repository/releases/$($release.id)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $current.draft) { throw "Entwurfstatus vor Upload nicht bestätigt." }
            foreach ($asset in @($current.assets | Where-Object { $_.name -eq $name })) {
              # Retain earlier draft files under explicit backup names; never overwrite published assets.
              gh api --method PATCH "repos/$repository/releases/assets/$($asset.id)" -f "name=previous-$($asset.id)-$name" --silent
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            $uri = "https://uploads.github.com/repos/$repository/releases/$($release.id)/assets?name=$([Uri]::EscapeDataString($name))"
            Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -InFile "installer-output/$name" -ContentType "application/octet-stream" | Out-Null
          }
